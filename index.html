<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4f6ef7" />
  <title>密码箱</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <!-- ================= 解锁 / 初始化 ================= -->
    <section id="view-lock" class="view is-active">
      <div class="lock-box">
        <div class="lock-mark" data-icon="shield"></div>
        <h1 class="lock-title">密码箱</h1>
        <p id="lock-hint" class="lock-hint">输入主密码解锁</p>

        <form id="lock-form" class="lock-form" autocomplete="off">
          <input
            id="lock-pw"
            class="lock-input"
            type="password"
            placeholder="主密码"
            autocomplete="current-password"
            spellcheck="false"
          />
          <input
            id="lock-pw2"
            class="lock-input"
            type="password"
            placeholder="再输一次"
            autocomplete="new-password"
            spellcheck="false"
            hidden
          />

          <div id="lock-strength" class="strength" hidden>
            <div class="strength-bar"><i></i><i></i><i></i><i></i></div>
            <span id="lock-strength-text" class="strength-text"></span>
          </div>

          <button id="lock-submit" class="btn primary block" type="submit">解锁</button>
          <p id="lock-msg" class="lock-msg" hidden></p>
        </form>

        <p id="lock-note" class="lock-note">主密码只存在你脑子里，忘了就真的打不开</p>
      </div>
    </section>

    <!-- ================= 列表 ================= -->
    <section id="view-list" class="view">
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-title">
            <h1>密码箱</h1>
            <p id="vault-meta" class="vault-meta">已锁定</p>
          </div>
          <div class="topbar-actions">
            <button id="btn-lock" class="icon-btn" data-icon="lock" title="锁定"></button>
            <button id="btn-settings" class="icon-btn" data-icon="gear" title="设置"></button>
          </div>
        </div>
        <div class="search">
          <span class="search-icon" data-icon="search"></span>
          <input id="search" type="search" placeholder="搜索标题、账号、标签" spellcheck="false" />
        </div>
        <div id="folders" class="folders"></div>
      </header>

      <div id="list" class="list"></div>
      <div id="empty" class="empty" hidden>
        <p class="empty-title">还没有东西</p>
        <p class="empty-text">点右下角的 + 存第一条密码</p>
      </div>

      <button id="btn-new" class="fab" data-icon="plus" title="新建"></button>
    </section>
  </main>

  <!-- ================= 编辑弹层 ================= -->
  <div id="sheet-edit" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2 id="edit-title">新建</h2>
        <button class="icon-btn" data-close="edit" data-icon="close" title="关闭"></button>
      </div>

      <form id="edit-form" class="form" autocomplete="off">
        <label class="field">
          <span class="field-label">标题</span>
          <input id="f-title" required placeholder="例如 GitHub" spellcheck="false" />
        </label>

        <label class="field">
          <span class="field-label">账号 / 用户名</span>
          <input id="f-username" placeholder="邮箱、用户名" spellcheck="false" />
        </label>

        <div class="field">
          <span class="field-label">密码 / 密钥</span>
          <textarea id="f-secret" rows="2" placeholder="密码、API Key、私钥" spellcheck="false"></textarea>
          <div class="field-tools">
            <button type="button" id="btn-generate" class="mini" data-icon="spark">生成</button>
            <button type="button" id="btn-reveal-edit" class="mini" data-icon="eye">显示</button>
          </div>
        </div>

        <label class="field">
          <span class="field-label">网址</span>
          <input id="f-url" inputmode="url" placeholder="选填" spellcheck="false" />
        </label>

        <div class="field">
          <span class="field-label">文件夹</span>
          <select id="f-folder"></select>
          <div id="folder-new" class="folder-new" hidden>
            <input id="f-folder-name" placeholder="新文件夹名字" spellcheck="false" />
            <button type="button" id="btn-folder-add" class="mini">建好</button>
          </div>
        </div>

        <label class="field">
          <span class="field-label">标签</span>
          <input id="f-tag" placeholder="例如 代码 / 邮箱 / 服务器" spellcheck="false" />
        </label>

        <label class="field">
          <span class="field-label">备注</span>
          <textarea id="f-note" rows="2" placeholder="选填" spellcheck="false"></textarea>
        </label>

        <div class="sheet-actions">
          <button type="button" id="btn-delete" class="btn danger" hidden>删除</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 生成器 ================= -->
  <div id="sheet-gen" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2>生成密码</h2>
        <button class="icon-btn" data-close="gen" data-icon="close" title="关闭"></button>
      </div>

      <div class="gen-out">
        <code id="gen-out"></code>
        <button id="gen-refresh" class="icon-btn" data-icon="refresh" title="换一个"></button>
      </div>

      <label class="field">
        <span class="field-label">长度 <b id="gen-len-label">20</b></span>
        <input id="gen-len" type="range" min="8" max="64" value="20" />
      </label>

      <div class="gen-toggles">
        <label><input type="checkbox" id="gen-lower" checked /> 小写</label>
        <label><input type="checkbox" id="gen-upper" checked /> 大写</label>
        <label><input type="checkbox" id="gen-digit" checked /> 数字</label>
        <label><input type="checkbox" id="gen-symbol" checked /> 符号</label>
      </div>

      <div class="sheet-actions">
        <button id="gen-copy" class="btn">复制</button>
        <button id="gen-use" class="btn primary">用这个</button>
      </div>
    </div>
  </div>

  <!-- ================= 设置 ================= -->
  <div id="sheet-settings" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2>设置</h2>
        <button class="icon-btn" data-close="settings" data-icon="close" title="关闭"></button>
      </div>

      <div class="settings">
        <label class="field">
          <span class="field-label">闲置多久自动锁定</span>
          <select id="s-autolock">
            <option value="1">1 分钟</option>
            <option value="5">5 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
          </select>
        </label>

        <div class="settings-block">
          <p class="settings-title">文件夹</p>
          <div id="folder-manage" class="folder-manage"></div>
        </div>

        <div class="settings-block">
          <p class="settings-title">备份</p>
          <p class="settings-note">导出的是加密文件，放到哪都行；换手机、清缓存前记得导一份。</p>
          <div class="settings-row">
            <button id="btn-export" class="btn" data-icon="download">导出备份</button>
            <button id="btn-import" class="btn" data-icon="upload">导入备份</button>
          </div>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>

        <div class="settings-block">
          <p class="settings-title">修改主密码</p>
          <label class="field">
            <span class="field-label">当前主密码</span>
            <input id="s-old-pw" type="password" autocomplete="current-password" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label">新主密码</span>
            <input id="s-new-pw" type="password" autocomplete="new-password" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label">再输一次</span>
            <input id="s-new-pw2" type="password" autocomplete="new-password" spellcheck="false" />
          </label>
          <button id="btn-rekey" class="btn">修改主密码</button>
        </div>

        <div class="settings-block danger-zone">
          <p class="settings-title">危险操作</p>
          <p class="settings-note">清空后本地什么都不剩，没有备份就找不回来了。</p>
          <button id="btn-wipe" class="btn danger">清空所有数据</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./vault.js"></script>
  <script src="./app.js"></script>
</body>
</html>
